name: Read-only character lookup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.repository == 'Dfupa/kanka-mcp-loremaster' &&
      github.ref == 'refs/heads/feat/read-only-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install existing read-only LoreMaster client
        run: python -m pip install -e .
      - name: Verify character identities (GET only; public-safe diagnostics)
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
        run: python scripts/verify_character_lookup.py
