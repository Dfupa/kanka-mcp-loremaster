name: One-time encrypted Kanka verification

on:
  push:
    branches: [feat/read-only-foundation]
    paths:
      - .github/workflows/kanka-private-read.yml
      - scripts/private_kanka_check.py

permissions:
  contents: read

jobs:
  read-only-verification:
    if: github.repository == 'Dfupa/kanka-mcp-loremaster'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install HTTP and encryption dependencies
        run: python -m pip install 'httpx>=0.28,<1' 'cryptography>=44,<48'
      - name: Query only authorized Kanka data and encrypt the response
        env:
          KANKA_API_TOKEN: ${{ secrets.KANKA_API_TOKEN }}
        run: python scripts/private_kanka_check.py
      - name: Upload encrypted artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanka-private-read-encrypted
          path: secure-result/report.encrypted.json
          if-no-files-found: error
          retention-days: 1
