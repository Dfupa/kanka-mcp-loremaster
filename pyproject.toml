[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kanka-mcp-loremaster"
version = "0.1.0"
description = "MCP lore reader with opt-in supervised Kanka creation and editing"
requires-python = ">=3.13"
dependencies = ["mcp>=1.30,<2", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.10"]

[project.scripts]
kanka-loremaster = "loremaster.server:main"
kanka-loremaster-approve = "loremaster.approve:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loremaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
